services:
  medical:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["hospital-data:/app/data"]
    environment:
      COOKIE_SECURE: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  hospital-data:
