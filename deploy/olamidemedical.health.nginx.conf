# Install only after obtaining the certificate paths below.
server {
    listen 80;
    server_name olamidemedical.health;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://olamidemedical.health$request_uri; }
}
server {
    listen 443 ssl;
    server_name olamidemedical.health;
    ssl_certificate /etc/letsencrypt/live/olamidemedical.health/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olamidemedical.health/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
