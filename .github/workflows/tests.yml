name: Hospital isolation and integration checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q server.py tenancy.py mobility.py devices.py registration.py operations.py telehealth.py clinical_ai.py ward.py safety.py deploy
      - run: npm ci --prefix tests/browser --no-audit --no-fund
      - run: npm test --prefix tests/browser
      - run: pip install 'ansible-core>=2.16,<2.20'
      - run: ansible-playbook -i localhost, ansible/deploy-multitenant.yml --syntax-check
